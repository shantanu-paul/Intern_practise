<text x="1305.0" y="620.3" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">empty &lt;= empty_next</text>
<text x="1305.0" y="635.9" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">Reset value: empty = 1</text>
