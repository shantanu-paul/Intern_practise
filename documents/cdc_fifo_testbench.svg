<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1120px" height="420px" viewBox="-0.5 -0.5 1120 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/>

  <!-- ==================== BOX 1: TESTBENCH ==================== -->
  <rect x="30" y="30" width="230" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="145" y="65" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">cdc_fifo_linear_tb</text>
  <text x="145" y="85" font-family="'Courier New', Courier, monospace" font-size="12" fill="#000000" text-anchor="middle">(Linear Stimulus)</text>
  <line x1="30" y1="100" x2="260" y2="100" stroke="#000000" stroke-width="1"/>
  
  <text x="42" y="125" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">1: Dual Reset Initialization</text>
  <text x="42" y="152" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">2: Single W/R Handshake</text>
  <text x="42" y="179" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">3: FIFO Full Detection</text>
  <text x="42" y="206" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">4: Overflow Protection</text>
  <text x="42" y="233" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">5: Empty Detection &amp; Ordering</text>
  <text x="42" y="260" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">6: Underflow Protection</text>
  <text x="42" y="287" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">7: Sweep Fast-to-Slow (5:1)</text>
  <text x="42" y="314" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">8: Sweep Slow-to-Fast (1:5)</text>
  <text x="42" y="341" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">9: Concurrent Read/Write</text>

  <!-- ==================== BOX 2: DUT ==================== -->
  <rect x="440" y="30" width="240" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="560" y="65" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">DEVICE UNDER TEST</text>
  <text x="560" y="85" font-family="'Courier New', Courier, monospace" font-size="12" fill="#000000" text-anchor="middle">(cdc_fifo_top)</text>
  <line x1="440" y1="100" x2="680" y2="100" stroke="#000000" stroke-width="1"/>
  
  <text x="455" y="130" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; cdc_fifo_mem (Storage)</text>
  <text x="455" y="165" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; cdc_2ff_sync (w2r, r2w)</text>
  <text x="455" y="200" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; cdc_bin2gray (2 converters)</text>
  <text x="455" y="235" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; cdc_gray2bin (4 converters)</text>
  <text x="455" y="270" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; Single Gray Pointer Regs</text>
  <text x="455" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; Dual Resets (in/out arst)</text>
  <text x="455" y="340" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; 4 SVA Concurrent Asserts</text>

  <!-- ==================== BOX 3: CHECKER ==================== -->
  <rect x="860" y="30" width="230" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="975" y="65" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">ASSERTION CHECKER</text>
  <text x="975" y="85" font-family="'Courier New', Courier, monospace" font-size="12" fill="#000000" text-anchor="middle">(Immediate &amp; SVA)</text>
  <line x1="860" y1="100" x2="1090" y2="100" stroke="#000000" stroke-width="1"/>

  <text x="872" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Reset Zero Count Check</text>
  <text x="872" y="165" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Exact Data Word Matching</text>
  <text x="872" y="200" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Full Ready De-assertion</text>
  <text x="872" y="235" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Empty Valid De-assertion</text>
  <text x="872" y="270" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Zero Drop Stability SVA</text>
  <text x="872" y="305" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Protocol Handshake SVA</text>
  <text x="872" y="340" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Clean 9/9 Pass Log Banner</text>

  <!-- ==================== INTERCONNECT ARROWS ==================== -->
  <!-- TB to DUT: Write Domain Signals -->
  <line x1="260" y1="130" x2="438" y2="130" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="122" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_in_clk, arst_ni</text>

  <line x1="260" y1="165" x2="438" y2="165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="157" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_in_i, valid_i</text>

  <line x1="440" y1="200" x2="262" y2="200" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="192" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_in_ready_o, count</text>

  <!-- TB to DUT: Read Domain Signals -->
  <line x1="260" y1="270" x2="438" y2="270" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="262" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_out_clk, arst_ni</text>

  <line x1="260" y1="305" x2="438" y2="305" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="297" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_out_ready_i</text>

  <line x1="440" y1="340" x2="262" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="332" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_out_valid_o, o, cnt</text>

  <!-- DUT to CHECKER -->
  <line x1="680" y1="165" x2="858" y2="165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="157" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_in_ready, count</text>

  <line x1="680" y1="270" x2="858" y2="270" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="262" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">data_out_valid, data_o</text>

  <line x1="680" y1="340" x2="858" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="332" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">SVA Assert Status</text>

</svg>