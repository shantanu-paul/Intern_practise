<text x="210.0" y="208.8" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">u_wr_reset_sync : reset_sync</text>
<text x="210.0" y="224.4" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">clk = wr_clk</text>
<text x="210.0" y="240.0" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">arst_n = arst_n</text>
<text x="210.0" y="255.6" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">srst_n = wr_rst_n</text>
