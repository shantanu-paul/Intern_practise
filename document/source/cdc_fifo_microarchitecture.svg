<text x="1590.0" y="208.8" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">u_rd_reset_sync : reset_sync</text>
<text x="1590.0" y="224.4" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">clk = rd_clk</text>
<text x="1590.0" y="240.0" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">arst_n = arst_n</text>
<text x="1590.0" y="255.6" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">srst_n = rd_rst_n</text>
<text x="1590.0" y="271.2" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">STAGES = RESET_SYNC_STAGES</text>
<rect x="35.0" y="355.0" width="270.0" height="150.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="170.0" y="398.8" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">WRITE CONTROL (wr_clk)</text>
<text x="170.0" y="414.4" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">Inputs: wr_en, full</text>
<text x="170.0" y="430.0" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">wr_fire = wr_en &amp;&amp; !full</text>
<text x="170.0" y="445.6" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">overflow &lt;= wr_en &amp;&amp; full</text>
<text x="170.0" y="461.2" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">Accepted write advances pointer</text>
<rect x="330.0" y="345.0" width="330.0" height="175.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="495.0" y="393.5" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">WRITE POINTER + GRAY</text>
<text x="495.0" y="409.1" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">wbin, wgray [PTR_W-1:0]</text>
<text x="495.0" y="424.7" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">wbin_next = wbin + wr_fire</text>
<text x="495.0" y="440.3" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">wgray_next = bin_to_gray(wbin_next)</text>
<text x="495.0" y="455.9" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">wr_clk: wbin &lt;= wbin_next</text>
<text x="495.0" y="471.5" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">wr_clk: wgray &lt;= wgray_next</text>
<rect x="330.0" y="555.0" width="330.0" height="115.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="495.0" y="581.3" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">FULL DETECTION (wr_clk)</text>
<text x="495.0" y="596.9" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">full_next = (wgray_next ==</text>
<text x="495.0" y="612.5" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">{~rgray_sync2[PTR_W-1:PTR_W-2],</text>
<text x="495.0" y="628.1" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle"> rgray_sync2[PTR_W-3:0]})</text>
<text x="495.0" y="643.7" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">full &lt;= full_next</text>
