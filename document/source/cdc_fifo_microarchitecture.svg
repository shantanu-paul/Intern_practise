<text x="1630.0" y="430.0" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">rd_fire = rd_en &amp;&amp; !empty</text>
<text x="1630.0" y="445.6" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">underflow &lt;= rd_en &amp;&amp; empty</text>
<text x="1630.0" y="461.2" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">Accepted read advances pointer</text>
