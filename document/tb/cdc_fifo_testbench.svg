<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1120px" height="420px" viewBox="-0.5 -0.5 1120 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/>

  <!-- ==================== BOX 1: TESTBENCH ==================== -->
  <rect x="30" y="30" width="230" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="145" y="65" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">cdc_fifo_linear_tb</text>
  <text x="145" y="85" font-family="'Courier New', Courier, monospace" font-size="12" fill="#000000" text-anchor="middle">(Linear Stimulus Steps)</text>
  <line x1="30" y1="100" x2="260" y2="100" stroke="#000000" stroke-width="1"/>
  
  <text x="42" y="124" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">1: Reset Initialization</text>
  <text x="42" y="149" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">2: Single Write/Read Integrity</text>
  <text x="42" y="174" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">3: FIFO Full Detection</text>
  <text x="42" y="199" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">4: Overflow Backpressure</text>
  <text x="42" y="224" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">5: Empty Detection &amp; Ordering</text>
  <text x="42" y="249" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">6: Underflow Protection</text>
  <text x="42" y="274" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">7: Clock Sweep (5:1 Fast-Wr)</text>
  <text x="42" y="299" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">8: Clock Sweep (1:5 Slow-Wr)</text>
  <text x="42" y="324" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">9: Concurrent Read/Write</text>
  <text x="42" y="349" font-family="'Courier New', Courier, monospace" font-size="10" fill="#000000">10: Blind DMA Burst Attack</text>

  <!-- ==================== BOX 2: DUT ==================== -->
  <rect x="440" y="30" width="240" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="560" y="65" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">DEVICE UNDER TEST</text>
  <text x="560" y="85" font-family="'Courier New', Courier, monospace" font-size="12" fill="#000000" text-anchor="middle">(cdc_fifo.sv)</text>
  <line x1="440" y1="100" x2="680" y2="100" stroke="#000000" stroke-width="1"/>
  
  <text x="455" y="130" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; Dual-Port SRAM Array mem[]</text>
  <text x="455" y="165" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; reset_sync (wr &amp; rd domains)</text>
  <text x="455" y="200" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; 2-Stage Gray Sync (r2w, w2r)</text>
  <text x="455" y="235" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; bin_to_gray() Logic</text>
  <text x="455" y="270" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; Conservative Full Next-State</text>
  <text x="455" y="305" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; Conservative Empty Next-State</text>
  <text x="455" y="340" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">&#8226; 1-Cycle Registered rd_data</text>

  <!-- ==================== BOX 3: CHECKER ==================== -->
  <rect x="860" y="30" width="230" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="975" y="65" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">VERIFICATION CHECKER</text>
  <text x="975" y="85" font-family="'Courier New', Courier, monospace" font-size="12" fill="#000000" text-anchor="middle">(Self-Checking Tasks)</text>
  <line x1="860" y1="100" x2="1090" y2="100" stroke="#000000" stroke-width="1"/>

  <text x="872" y="130" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Reset Safe State Check</text>
  <text x="872" y="165" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Exact Data Word Matching</text>
  <text x="872" y="200" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Full Flag Backpressure</text>
  <text x="872" y="235" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Empty Flag Underflow Protect</text>
  <text x="872" y="270" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; rd_valid 1-Cycle Latency</text>
  <text x="872" y="305" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; overflow / underflow Pulses</text>
  <text x="872" y="340" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#000000">&#8226; Pass/Fail Summary Banner</text>

  <!-- ==================== INTERCONNECT ARROWS ==================== -->
  <!-- Common Reset -->
  <line x1="260" y1="110" x2="438" y2="110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="103" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">arst_n (Active-Low)</text>

  <!-- TB to DUT: Write Domain Signals -->
  <line x1="260" y1="145" x2="438" y2="145" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="138" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">wr_clk, wr_en, wr_data</text>

  <!-- DUT to TB: Write Feedback (full, overflow) -->
  <line x1="440" y1="180" x2="262" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="173" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">full, overflow</text>

  <!-- TB to DUT: Read Domain Signals -->
  <line x1="260" y1="260" x2="438" y2="260" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="253" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">rd_clk, rd_en</text>

  <!-- DUT to TB: Read Feedback (empty, underflow, rd_valid, rd_data) -->
  <line x1="440" y1="295" x2="262" y2="295" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="288" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">rd_data, rd_valid</text>

  <line x1="440" y1="330" x2="262" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="323" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">empty, underflow</text>

  <!-- DUT to CHECKER: Write Side Signals -->
  <line x1="680" y1="145" x2="858" y2="145" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="138" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">full, overflow</text>

  <!-- DUT to CHECKER: Read Side Signals -->
  <line x1="680" y1="270" x2="858" y2="270" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="262" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">rd_valid, rd_data</text>

  <line x1="680" y1="330" x2="858" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="323" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000" text-anchor="middle">empty, underflow</text>

</svg>
