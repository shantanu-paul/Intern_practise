<text x="900.0" y="445.1" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">ONE SHARED BEHAVIORAL ARRAY</text>
<text x="900.0" y="460.7" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">mem[0:DEPTH-1]</text>
<text x="900.0" y="476.3" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">Default: 16 words × 32 bits</text>
<text x="900.0" y="491.9" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">WRITE PORT (wr_clk):</text>
<text x="900.0" y="507.5" fill="#000000" font-size="13" text-anchor="middle" dominant-baseline="middle">if (wr_fire) mem[wbin[ADDR_WIDTH-1:0]] &lt;= wr_data</text>
